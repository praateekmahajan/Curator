    host_path: /lustre/fsw/portfolios/nemotron/projects/nemotron_n4_pre/nemotron-v4/sandia/users/praateekm/benchmarking
  - name: kmeans_input
    host_path: /lustre/fsw/portfolios/nemotron/projects/nemotron_n4_pre/nemotron-v4/sandia/users/praateekm/benchmarking/kmeans-mistral-nvidia-category-20260722/nvidia-vs-mistral-en-humanities-fit-auto-6-nodes-v03/kmeans

sinks: []
delete_scratch: true
object_store_size: default
gpu_mem_use_warning_threshold: 0.01
gpu_stats_recorder:
  interval_s: 1

ray:
  num_cpus: 16
  num_gpus: 1
  enable_object_spilling: false

entries:
  - name: v01-current-ranked-centroid-204-b1024
