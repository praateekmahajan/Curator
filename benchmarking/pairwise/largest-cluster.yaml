    args: >-
      --benchmark-results-path={session_entry_dir}
      --input-path={kmeans_input}
      --output-path={session_entry_dir}/pairwise
      --centroid-id=204
      --embedding-dim=1024
      --id-field=_curator_dedup_id
      --embedding-field=embeddings
      --input-embedding-dtype=auto
      --pairwise-batch-size=1024
    timeout_s: 7200
