paths:
  - name: results_path
    host_path: /lustre/fsw/portfolios/nemotron/projects/nemotron_n4_pre/users/praateekm/benchmarking/sft_fuzzy_dedup/outputs

gpu_stats_recorder:
  interval_s: 1.0

datasets:
  - name: sft_qa_parse_success
    formats:
      - type: parquet
        path: /lustre/fsw/portfolios/nemotron/projects/nemotron_n4_pre/datasets/sft/clean/qa_parse_status=true

default_timeout_s: 13200
max_timeout_s: 13200
sinks: []
delete_scratch: false
object_store_size: 536870912000
gpu_mem_use_warning_threshold: 0.01

ray:
  num_cpus: 128
  num_gpus: 8
  enable_object_spilling: false

entries:
  - name: dedup_fuzzy_question_default
    script: fuzzy_dedup_identification_benchmark.py
    args: >-
      --benchmark-results-path={session_entry_dir}
      --input-path={dataset:sft_qa_parse_success,parquet}
      --cache-path={session_entry_dir}/scratch/cache
      --output-path={session_entry_dir}/scratch/output
      --input-filetype=parquet
      --id-field=int_id
      --text-field=question
      --bands-per-iteration=20
      --input-blocksize=1.5GiB
    timeout_s: 13200

  - name: dedup_fuzzy_combined_question_answer_default
    script: fuzzy_dedup_identification_benchmark.py
    args: >-
      --benchmark-results-path={session_entry_dir}
      --input-path={dataset:sft_qa_parse_success,parquet}
      --cache-path={session_entry_dir}/scratch/cache
      --output-path={session_entry_dir}/scratch/output
      --input-filetype=parquet
      --id-field=int_id
      --text-field=combined_question_answer
      --bands-per-iteration=20
      --input-blocksize=1.5GiB
    timeout_s: 13200
