paths:
  - name: results_path
    host_path: /lustre/fsw/portfolios/nemotron/projects/nemotron_n4_pre/users/praateekm/benchmarking/results
  - name: output_path
    host_path: /lustre/fsw/portfolios/nemotron/projects/nemotron_n4_pre/users/praateekm/benchmarking/output
  - name: text_models_hf_cache
    host_path: /lustre/fsw/portfolios/nemotron/projects/nemotron_n4_pre/users/praateekm/datasets/text_models_hf_cache

datasets:
  - name: sft_qa_parse_success
    formats:
      - type: parquet
        path: /lustre/fsw/portfolios/nemotron/projects/nemotron_n4_pre/datasets/sft/clean/qa_parse_status=true
  - name: text_models_hf_cache
    formats:
      - type: files
        path: /lustre/fsw/portfolios/nemotron/projects/nemotron_n4_pre/datasets/text_models_hf_cache

gpu_stats_recorder:
  interval_s: 1.0
delete_scratch: false
ray:
  num_cpus: 128
  num_gpus: 8
  enable_object_spilling: false

entries:
  - name: harrier_oss_270m_${SLURM_ARRAY_TASK_ID}_${SLURM_JOB_ID}
    script: /lustre/fsw/portfolios/nemotron/projects/nemotron_n4_pre/users/praateekm/benchmarking/sft_fuzzy_dedup/worktree/benchmarking/sft_semantic_deudp/01_embedding.py
    args: >-
      --benchmark-results-path={session_entry_dir}
      --input-path={dataset:sft_qa_parse_success,parquet}
      --output-path={output_path}
      --executor=ray_data
      --model-identifier=${EMBEDDING_MODEL}
      --num-vllm-replicas-per-gpu=4
      --dataset-ratio=0.1
      --cache-dir={dataset:text_models_hf_cache,files}
    timeout_s: 12000
