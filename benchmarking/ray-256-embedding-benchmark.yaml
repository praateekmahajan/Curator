datasets:
  - name: reddit_polished_10min
    formats:
      - type: jsonl
        path: "{reddit_datasets_path}/reddit-polished-307200-rows-300-shards"
  - name: text_models_hf_cache
    formats:
      - type: files
        path: "{model_weights_path}/hub"

sinks:
  - name: slack
    enabled: false

gpu_stats_recorder:
  interval_s: 1.0

delete_scratch: false
object_store_size: 322122547200
gpu_mem_use_warning_threshold: 0.01

ray:
  num_cpus: 64
  num_gpus: 4
  enable_object_spilling: false

entries:
  - name: embedding_generation_raydata_dp4_gpu1
    enabled: false
    script: embedding_generation_benchmark.py
    args: >-
      --benchmark-results-path={session_entry_dir}
      --output-path={session_entry_dir}/scratch/output
      --executor=ray_data
      --input-path={dataset:reddit_polished_10min,jsonl}
      --input-format=jsonl
      --load-dataset-ratio=1.0
      --model-identifier=Qwen/Qwen3-Embedding-0.6B
      --model-variation=vllm_text_pretokenized
      --model-num-workers=4
      --model-worker-gpus=1.0
      --model-gpu-memory-utilization=0.90
      --cache-dir={dataset:text_models_hf_cache,files}
    timeout_s: 1200
