paths:
  - name: results_path
    host_path: /lustre/fsw/portfolios/nemotron/projects/nemotron_n4_pre/nemotron-v4/sandia/users/praateekm/benchmarking
  - name: nvidia_crawl_n55_embeddings
    host_path: /lustre/fsw/portfolios/nemotron/projects/nemotron_n4_pre/nemotron-v4/sandia/users/praateekm/results/embedding-slurm-array-full-20260717/web/english/nvidia/crawl-n5.5-apr-2025
  - name: nvidia_crawl_embeddings
    host_path: /lustre/fsw/portfolios/nemotron/projects/nemotron_n4_pre/nemotron-v4/sandia/users/praateekm/results/embedding-slurm-array-full-20260717/web/english/nvidia/crawl
  - name: mistral_other_high_embeddings
    host_path: /lustre/fsw/portfolios/nemotron/projects/nemotron_n4_pre/nemotron-v4/sandia/users/praateekm/results/embedding-slurm-array-full-20260717/web/english/mistral/web1_2_en_other_high
sinks: []
delete_scratch: true
object_store_size: default
gpu_mem_use_warning_threshold: 0.01
gpu_stats_recorder:
  interval_s: 1
ray:
  num_cpus: 144
  num_gpus: 4
  enable_object_spilling: false
entries:
  - name: web1_2_en_other_high_vs_nvidia_5pct
    enabled: false
    script: ../semdedup/kmeans.py
    args: >-
      --benchmark-results-path={session_entry_dir}
      --input-path={nvidia_crawl_n55_embeddings}
      --input-path={nvidia_crawl_embeddings}
      --input-path={mistral_other_high_embeddings}
      --output-path={session_entry_dir}/kmeans
      --centroids-path={session_entry_dir}/centroids
      --embedding-dim=1024
      --n-clusters=128
      --id-field=_curator_dedup_id
      --embedding-field=embeddings
      --fit-data-fraction=0.05
      --init=k-means||
      --write-batch-size=auto
      --max-output-file-size-mb=1000
    timeout_s: 7200
  - name: web1_2_en_other_high_vs_nvidia_5pct-uncompressed-v2
    script: ../semdedup/kmeans.py
    args: >-
      --benchmark-results-path={session_entry_dir}
      --input-path={nvidia_crawl_n55_embeddings}
      --input-path={nvidia_crawl_embeddings}
      --input-path={mistral_other_high_embeddings}
      --output-path={session_entry_dir}/kmeans
      --centroids-path={session_entry_dir}/centroids
      --embedding-dim=1024
      --id-field=_curator_dedup_id
      --embedding-field=embeddings
      --fit-data-fraction=0.05
      --init=k-means||
      --write-batch-size=auto
      --compression=none
      --max-output-file-size-mb=512
      --prefetch-next-group
    timeout_s: 7200
