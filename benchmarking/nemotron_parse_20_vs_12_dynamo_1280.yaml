# Four-entry comparison of Nemotron Parse 2.0 and 1.2 using in-process vLLM
# and Dynamo/vLLM. Entries are intentionally ordered with Parse 2.0 first.

paths:
  - name: "datasets_path"
    host_path: "/raid/praateekm/pdf_processing"
    container_path: "/pdf_processing"
  - name: "model_weights_path"
    host_path: "/raid/praateekm/hf_cache/hub"
    container_path: "/model_weights"
  - name: "results_path"
    host_path: "/raid/praateekm/pdf_processing/results"
    container_path: "/benchmark_results"

datasets:
  - name: "pdf"
    formats:
      - type: "zipfiles"
        path: "{datasets_path}/zipfiles"
      - type: "manifest"
        path: "{datasets_path}/manifests"

default_timeout_s: 28800
max_timeout_s: 28800
delete_scratch: false
object_store_size: 536870912000
gpu_mem_use_warning_threshold: 0.01

gpu_stats_recorder:
  interval_s: 1.0

ray:
  num_cpus: 64
  num_gpus: 4
  enable_object_spilling: false

sinks:
  - name: slack
    enabled: false
    live_updates: false
    channel_id: ${SLACK_CHANNEL_ID}
    default_metrics: ["exec_time_s"]
    ping_users_on_failure: false

entries:
  - name: pdf_1280_parse20_in_process_p10_gpu4
    enabled: true
    script: nemotron_parse_pdf_benchmark.py
    args: >-
      --benchmark-results-path={session_entry_dir}
      --executor=ray_data
      --inference-mode=in_process_vllm
      --manifest={dataset:pdf,manifest}/manifest_0000-0999_chunk00.jsonl
      --zip-base-dir={dataset:pdf,zipfiles}
      --output-dir={session_entry_dir}/scratch/output
      --model-id=nvidia/NVIDIA-Nemotron-Parse-2.0
      --model-path={model_weights_path}/models--nvidia--NVIDIA-Nemotron-Parse-2.0/snapshots/635b84d9b09bb9526b9a684d0b2c953d3cc3df05
      --backend=vllm
      --pdfs-per-task=10
      --max-pdfs=1280
      --gpu-num-workers=4
      --accounting-num-gpus=4

  - name: pdf_1280_parse20_dynamo_http_nonstream_c32_p10_b32_nomaxseq_gpu4
    enabled: true
    script: nemotron_parse_pdf_benchmark.py
    args: >-
      --benchmark-results-path={session_entry_dir}
      --executor=ray_data
      --inference-mode=dynamo_http
      --manifest={dataset:pdf,manifest}/manifest_0000-0999_chunk00.jsonl
      --zip-base-dir={dataset:pdf,zipfiles}
      --output-dir={session_entry_dir}/scratch/output
      --model-id=nvidia/NVIDIA-Nemotron-Parse-2.0
      --model-path={model_weights_path}/models--nvidia--NVIDIA-Nemotron-Parse-2.0/snapshots/635b84d9b09bb9526b9a684d0b2c953d3cc3df05
      --backend=vllm
      --pdfs-per-task=10
      --max-pdfs=1280
      --server-num-replicas=4
      --client-num-workers=32
      --request-batch-size=32
      --no-dynamo-use-vllm-chat-processor
      --no-inference-server-stream
      --inference-server-max-tokens=8192
      --inference-server-request-timeout-s=300
      --accounting-num-gpus=4
      --engine-kwargs='{"tensor_parallel_size": 1, "disable_hybrid_kv_cache_manager": false, "enable_prefix_caching": false}'

  - name: pdf_1280_parse12_in_process_p10_gpu4
    enabled: true
    script: nemotron_parse_pdf_benchmark.py
    args: >-
      --benchmark-results-path={session_entry_dir}
      --executor=ray_data
      --inference-mode=in_process_vllm
      --manifest={dataset:pdf,manifest}/manifest_0000-0999_chunk00.jsonl
      --zip-base-dir={dataset:pdf,zipfiles}
      --output-dir={session_entry_dir}/scratch/output
      --model-id=nvidia/NVIDIA-Nemotron-Parse-v1.2
      --model-path={model_weights_path}/models--nvidia--NVIDIA-Nemotron-Parse-v1.2/snapshots/2bd0189bffd6cdded6280d9f22a4077b25a504e3
      --backend=vllm
      --pdfs-per-task=10
      --max-pdfs=1280
      --gpu-num-workers=4
      --accounting-num-gpus=4

  - name: pdf_1280_parse12_dynamo_http_nonstream_c32_p10_b32_nomaxseq_gpu4
    enabled: true
    script: nemotron_parse_pdf_benchmark.py
    args: >-
      --benchmark-results-path={session_entry_dir}
      --executor=ray_data
      --inference-mode=dynamo_http
      --manifest={dataset:pdf,manifest}/manifest_0000-0999_chunk00.jsonl
      --zip-base-dir={dataset:pdf,zipfiles}
      --output-dir={session_entry_dir}/scratch/output
      --model-id=nvidia/NVIDIA-Nemotron-Parse-v1.2
      --model-path={model_weights_path}/models--nvidia--NVIDIA-Nemotron-Parse-v1.2/snapshots/2bd0189bffd6cdded6280d9f22a4077b25a504e3
      --backend=vllm
      --pdfs-per-task=10
      --max-pdfs=1280
      --server-num-replicas=4
      --client-num-workers=32
      --request-batch-size=32
      --no-dynamo-use-vllm-chat-processor
      --no-inference-server-stream
      --inference-server-max-tokens=8192
      --inference-server-request-timeout-s=300
      --accounting-num-gpus=4
      --engine-kwargs='{"tensor_parallel_size": 1, "disable_hybrid_kv_cache_manager": false, "enable_prefix_caching": false}'
