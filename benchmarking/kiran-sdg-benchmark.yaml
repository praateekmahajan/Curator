entries:
  - name: kiran_sdg_translation_eval_curator_dynamo_4gpu
    enabled: true
    script: kiran_sdg_translation_eval_benchmark.py
    timeout_s: 28800
    ray:
      num_cpus: 64
      num_gpus: 4
      enable_object_spilling: false
    args: >-
      --benchmark-results-path={session_entry_dir}
      --input-path={kiran_data_path}/data/local_1024
      --config-path={kiran_data_path}/en_hi_native_nostruct_g412b.bigiron.json
      --output-path={session_entry_dir}/output
      --checkpoint-path={session_entry_dir}/checkpoints
      --translation-model-path={model_weights_path}/models--RedHatAI--gemma-4-12B-it-FP8-Dynamic/snapshots/67e53491df7a281623fa740de61307d5c542b7f4
      --evaluation-model-path={model_weights_path}/models--RedHatAI--gemma-4-31B-it-FP8-block/snapshots/e1c5d725be4d3349e85334dc108e901dd99521e4
      --executor=ray_data
      --files-per-partition=1
      --client-workers=2
      --translation-concurrency=64
      --evaluation-concurrency=48
      --ndd-run-mode=create
      --ndd-artifact-path={session_entry_dir}/ndd-artifacts
      --ndd-resume-mode=if_possible
      --ndd-buffer-size=64
      --ndd-max-in-flight-tasks=192
      --translation-replicas=2
      --evaluation-replicas=1
      --max-num-seqs=256
      --max-model-len=32768
      --evaluation-disable-deep-gemm
      --disable-speculative
    requirements:
      - metric: input_file_count
        exact_value: 16
      - metric: input_row_count
        exact_value: 16384
      - metric: output_row_count
        exact_value: 16384
